# Named webhook Kafka sources. Exactly one entry must have enabled: true.
# Point Hub at this file and restart to flip clusters:
#   export GIT_WEBHOOK_KAFKA_SOURCES_FILE=/path/to/this-file.yml
# Shared defaults (formats dir, value codec, PEM passphrase used by every source unless overridden)
# stay in the pod env (GIT_WEBHOOK_EVENT_FORMATS_DIR, GIT_WEBHOOK_KAFKA_SSL_*, …).

sources:
  - id: uat-a
    enabled: true
    bootstrap-servers: broker-a.example:9092
    incremental-topic: git.webhook.events
    group-id: git-mirror-hub-uat-a
    security-protocol: SSL
    ssl-truststore-location: /path/ca.pem
    ssl-keystore-location: /path/client.pem
    ssl-key-password: change-me

  - id: uat-b
    enabled: false
    bootstrap-servers: broker-b.example:9092
    incremental-topic: git.webhook.events
    group-id: git-mirror-hub-uat-b
    security-protocol: SSL
    ssl-truststore-location: /path/ca.pem
    ssl-keystore-location: /path/client-b.pem
    ssl-key-password: change-me
