server:
  port: 8080

spring:
  application:
    name: git-mirror-utility
  datasource:
    url: jdbc:h2:file:./data/gitutility;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: ${GIT_H2_CONSOLE_ENABLED:false}
      path: /h2-console
  # Boot 4.x relocated these keys: `spring.data.mongodb.*` is a deprecated (level=error)
  # tombstone that is NO LONGER BOUND — setting it silently falls back to Boot's built-in
  # default `mongodb://localhost/test`, so MONGODB_URI would be ignored entirely.
  mongodb:
    # Effective only when git-utility.persistence.provider=mongo; every other mode excludes Mongo autoconfiguration
    uri: ${MONGODB_URI:mongodb://localhost:27017/gitutility}
    database: ${MONGODB_DATABASE:gitutility}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    # Supports CloudAMQP connection strings via SPRING_RABBITMQ_ADDRESSES or host/port
    addresses: ${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        # Boot 4.x renamed max-attempts -> max-retries (same semantics, default 3)
        max-retries: 3
        multiplier: 2.0
    listener:
      simple:
        auto-startup: true
        concurrency: 1
        max-concurrency: 5
        prefetch: 1
        default-requeue-rejected: false
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 2000ms
          # Boot 4.x renamed max-attempts -> max-retries (same semantics, default 3)
          max-retries: 3
          multiplier: 2.0
          max-interval: 10000ms

git-utility:
  workspace-dir: ${GIT_WORKSPACE_DIR:/tmp/git-utility-mirrors}
  peer-heartbeat-seconds: ${GIT_PEER_HEARTBEAT_SECONDS:120}
  peer-heartbeat-ms: ${GIT_PEER_HEARTBEAT_MS:120000}
  github:
    graphql-enabled: ${GITHUB_GRAPHQL_ENABLED:true}
  features:
    public-repos-enabled: ${FEATURE_PUBLIC_REPOS:true}
    provider-gitlab-enabled: ${FEATURE_PROVIDER_GITLAB:false}
    provider-bitbucket-enabled: ${FEATURE_PROVIDER_BITBUCKET:false}
    provider-origin-enabled: ${FEATURE_PROVIDER_ORIGIN:false}
    provider-generic-enabled: ${FEATURE_PROVIDER_GENERIC:false}
  git:
    http-timeout-seconds: ${GIT_HTTP_TIMEOUT_SECONDS:600}
    push-batch-size: ${GIT_PUSH_BATCH_SIZE:8}
    push-batch-retries: ${GIT_PUSH_BATCH_RETRIES:3}
    push-bulk-bootstrap: ${GIT_PUSH_BULK_BOOTSTRAP:true}
    # Push-batch fan-out: per-job parallel batches (wave), capped by the shared pool size,
    # a pod-wide per-destination-host connection cap, live resource headroom, and a
    # pod-wide cooldown that collapses fan-out after a detected Git throttle/429.
    push-batch-concurrency: ${GIT_PUSH_BATCH_CONCURRENCY:2}
    push-batch-pool-max-threads: ${GIT_PUSH_BATCH_POOL_MAX_THREADS:8}
    push-batch-per-host-max: ${GIT_PUSH_BATCH_PER_HOST_MAX:4}
    push-batch-throttle-cooldown-seconds: ${GIT_PUSH_BATCH_THROTTLE_COOLDOWN_SECONDS:60}
    # Cap on a rate-limit episode. Later 429s add jitter, but the deadline never sits further than this from now.
    push-batch-throttle-cooldown-max-seconds: ${GIT_PUSH_BATCH_THROTTLE_COOLDOWN_MAX_SECONDS:1800}
    push-batch-cpu-high-watermark: ${GIT_PUSH_BATCH_CPU_HIGH_WATERMARK:0.90}
    push-batch-heap-high-watermark-percent: ${GIT_PUSH_BATCH_HEAP_HIGH_WATERMARK_PERCENT:85}
    push-batch-disk-low-watermark-percent: ${GIT_PUSH_BATCH_DISK_LOW_WATERMARK_PERCENT:10}
    lfs-batch-size: ${GIT_LFS_BATCH_SIZE:50}
    lfs-discovery-threads: ${GIT_LFS_DISCOVERY_THREADS:4}
    lfs-transfer-concurrency: ${GIT_LFS_TRANSFER_CONCURRENCY:4}
    pr-create-concurrency: ${GIT_PR_CREATE_CONCURRENCY:6}
    pr-fork-fetch-batch-size: ${GIT_PR_FORK_FETCH_BATCH_SIZE:32}
    pr-list-page-size: ${GIT_PR_LIST_PAGE_SIZE:100}
    pr-skip-existing-heads: ${GIT_PR_SKIP_EXISTING_HEADS:true}
    pr-head-prep-progress-interval: ${GIT_PR_HEAD_PREP_PROGRESS_INTERVAL:1}
    pr-fork-lazy-materialize: ${GIT_PR_FORK_LAZY_MATERIALIZE:true}
    pr-fork-push-object-refs: ${GIT_PR_FORK_PUSH_OBJECT_REFS:true}
    release-page-size: ${GIT_RELEASE_PAGE_SIZE:50}
    release-concurrency: ${GIT_RELEASE_CONCURRENCY:4}
    ci-check-tip-limit: ${GIT_CI_CHECK_TIP_LIMIT:8}
    http-post-buffer-bytes: ${GIT_HTTP_POST_BUFFER_BYTES:524288000}
  sync:
    # Agentic / bot branch prefixes: live webhooks skipped; Smart full sync tip-probes them for DR.
    ephemeral-branch-prefixes: ${GIT_SYNC_EPHEMERAL_PREFIXES:agents/,agent/,dependabot/,renovate/,snyk-bot/,greenkeeper/,fork-pr-,sync-conflict/}
    incremental-coalesce-enabled: ${GIT_SYNC_INCREMENTAL_COALESCE:true}
    incremental-coalesce-window-ms: ${GIT_SYNC_INCREMENTAL_COALESCE_MS:45000}
  storage:
    local-dir: ${GIT_STORAGE_LOCAL_DIR:${GIT_WORKSPACE_DIR:/tmp/git-utility-mirrors}}
    nas-dir: ${GIT_STORAGE_NAS_DIR:/tmp/git-utility-nas-mirrors}
    max-disk-quota-mb: ${GIT_STORAGE_MAX_DISK_QUOTA_MB:51200}
    max-cached-repos: ${GIT_STORAGE_MAX_CACHED_REPOS:1000}
    retention-hours: ${GIT_STORAGE_RETENTION_HOURS:72}
    unmapped-webhook-ttl-days: ${GIT_UNMAPPED_WEBHOOK_TTL_DAYS:7}
    unmapped-webhook-purge-days: ${GIT_UNMAPPED_WEBHOOK_PURGE_DAYS:7}
    unmapped-webhook-purge-interval-minutes: ${GIT_UNMAPPED_WEBHOOK_PURGE_INTERVAL_MINUTES:60}
  throttle:
    max-concurrent-git-pushes: ${GIT_THROTTLE_MAX_CONCURRENT_PUSHES:5}
    metadata-sync-interval-seconds: ${GIT_METADATA_SYNC_INTERVAL_SEC:30}
  circuit-breaker:
    failure-threshold: ${GIT_CIRCUIT_BREAKER_THRESHOLD:5}
    reset-timeout-seconds: ${GIT_CIRCUIT_BREAKER_RESET_SEC:30}
    probe-delay-ms: ${GIT_CIRCUIT_BREAKER_PROBE_MS:30000}
  persistence:
    # Canonical: h2 (default) | mongo — exactly one store active at runtime; no fallback, no dual wiring
    provider: ${GIT_PERSISTENCE_PROVIDER:h2}
  messaging:
    # Canonical: rabbitmq (default) | kafka (reserved) | none (in-process, no broker)
    provider: ${GIT_MESSAGING_PROVIDER:rabbitmq}
    none:
      # In-process full+incremental sync worker threads (GIT_MESSAGING_PROVIDER=none only)
      worker-threads: ${GIT_MESSAGING_NONE_WORKER_THREADS:8}
  webhook-bus:
    # Incremental git events only. off | kafka | rabbitmq. Full mirrors stay on messaging.provider.
    provider: ${GIT_WEBHOOK_BUS_PROVIDER:off}
    kafka:
      bootstrap-servers: ${GIT_WEBHOOK_KAFKA_BOOTSTRAP_SERVERS:}
      security-protocol: ${GIT_WEBHOOK_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl-mechanism: ${GIT_WEBHOOK_KAFKA_SASL_MECHANISM:PLAIN}
      sasl-username: ${GIT_WEBHOOK_KAFKA_SASL_USERNAME:}
      sasl-password: ${GIT_WEBHOOK_KAFKA_SASL_PASSWORD:}
      client-id: ${GIT_WEBHOOK_KAFKA_CLIENT_ID:git-mirror-hub}
      group-id: ${GIT_WEBHOOK_KAFKA_GROUP_ID:git-mirror-hub}
      auto-offset-reset: ${GIT_WEBHOOK_KAFKA_AUTO_OFFSET_RESET:earliest}
      incremental-topic: ${GIT_WEBHOOK_KAFKA_INCREMENTAL_TOPIC:git.sync.incremental}
      partitions: ${GIT_WEBHOOK_KAFKA_INCREMENTAL_PARTITIONS:32}
      replication-factor: ${GIT_WEBHOOK_KAFKA_REPLICATION_FACTOR:1}
      listener-concurrency: ${GIT_WEBHOOK_KAFKA_LISTENER_CONCURRENCY:4}
      max-poll-interval-ms: ${GIT_WEBHOOK_KAFKA_MAX_POLL_INTERVAL_MS:600000}
      session-timeout-ms: ${GIT_WEBHOOK_KAFKA_SESSION_TIMEOUT_MS:45000}
    rabbitmq:
      addresses: ${GIT_WEBHOOK_RABBITMQ_ADDRESSES:${SPRING_RABBITMQ_ADDRESSES:}}
      exchange: ${GIT_WEBHOOK_RABBITMQ_EXCHANGE:git.webhook.exchange}
      queue: ${GIT_WEBHOOK_RABBITMQ_QUEUE:git.webhook.incremental.queue}
      routing-key: ${GIT_WEBHOOK_RABBITMQ_ROUTING_KEY:git.webhook.incremental}
      dlx: ${GIT_WEBHOOK_RABBITMQ_DLX:git.webhook.dlx}
      dlq: ${GIT_WEBHOOK_RABBITMQ_DLQ:git.webhook.incremental.dlq}
      prefetch: ${GIT_WEBHOOK_RABBITMQ_PREFETCH:1}
      concurrency: ${GIT_WEBHOOK_RABBITMQ_CONCURRENCY:1}
  bulk:
    # Bulk migration soft request guard (submission-time probing) — NOT an execution cap:
    # execution is paced by lane threads/consumer concurrency; extra jobs wait as QUEUED.
    max-items: ${GIT_BULK_MAX_ITEMS:1000}
    # Destination probes (exists / write / has-commits) process items in chunks of this size
    probe-chunk-size: ${GIT_BULK_PROBE_CHUNK_SIZE:250}
    probe-concurrency: ${GIT_BULK_PROBE_CONCURRENCY:5}
  queue:
    pause-consumers-on-startup: ${GIT_QUEUE_PAUSE_ON_STARTUP:true}
    orphan-job-grace-seconds: ${GIT_QUEUE_ORPHAN_GRACE_SEC:120}
    exchange: git.sync.exchange
    main-queue: git.sync.queue
    routing-key: git.sync.key
    incremental-queue: git.sync.incremental.queue
    incremental-routing-key: git.sync.incremental.key
    inbound-queue: git.sync.inbound.queue
    inbound-routing-key: git.webhook.inbound
    dlx-exchange: git.sync.dlx
    dlq-queue: git.sync.dlq
    dlq-routing-key: git.sync.dlq.key
    max-retry-attempts: ${GIT_MAX_RETRY_ATTEMPTS:3}
    retry-initial-interval-ms: ${GIT_RETRY_INITIAL_INTERVAL_MS:3000}
    retry-multiplier: ${GIT_RETRY_MULTIPLIER:2.0}
    retry-max-interval-ms: ${GIT_RETRY_MAX_INTERVAL_MS:30000}
  dedup:
    ledger-ttl-seconds: 600
    cache-max-entries: 5000
  security:
    encryption-key: ${GIT_UTILITY_ENCRYPTION_KEY:}
  cors:
    # Comma-separated origin patterns for the local React UI. Keep localhost-only unless you add auth.
    allowed-origin-patterns: ${GIT_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name:git-mirror-utility}

logging:
  level:
    com.gitutility: INFO
    org.springframework.amqp: INFO
    org.eclipse.jgit: INFO
